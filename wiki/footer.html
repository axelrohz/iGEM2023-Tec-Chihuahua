<!DOCTYPE html>
<html>
<head>
  <title>Nombre de tu sitio web</title>
  <!-- Agrega aquí tus enlaces a archivos CSS, fuentes, etc. si los tienes -->
  <style>
    /* Estilos para el contenedor de la marquesina */
    .marquee {
      display: flex;
      overflow: hidden;
      white-space: nowrap;
      animation: marquee 20s linear infinite; /* Ajusta la velocidad según lo desees */
      animation: marquee 20s linear infinite;
    }
    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    
    .footer {
      background-color: #f9f9f9; /* Cambia el color de fondo a un tono claro */
      color: #333; /* Cambia el color del texto a un gris oscuro */
      padding: 30px 0; /* Añade un poco de espacio alrededor del contenido del footer */
      text-align: center; /* Centra el contenido del footer */
    }
    .footer h4 {
      color: #555; /* Color de encabezado más suave */
    }
    .footer p {
      margin-bottom: 10px; /* Espacio entre párrafos en el footer */
    }
    /* Estilos para el botón "Back to Top" */
    .back-to-top {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: none;
      cursor: pointer;
    }
    
    /* Resto de tus estilos... */
    @media (max-width: 768px) {
      .marquee a img {
        max-height: 20px; /* Ajusta la altura deseada para pantallas pequeñas */
        margin: 0 5px; /* Espacio entre las imágenes en pantallas pequeñas */
      }
      /* Ajusta otros estilos aquí si es necesario */
    }
    .marquee a img {
      /* ... (otros estilos) ... */
      max-height: 30px; /* Ajusta la altura deseada */
      margin: 0 10px; /* Espacio entre las imágenes */
    }
  </style>
</head>
<body>
  <!-- Contenido de tu sitio web -->
  <div>
    <!-- ... (contenido del sitio web) ... -->
  </div>

  <!-- Footer con marquesina para sponsors -->
  <footer class="pt-5 pb-5 footer py-5 mt-5 bg-light text-dark">
    <div class="container">
      <div class="row mb-4">
        <div class="col-lg-4 col-md-6 col-sm-12">
          <h4 class="mb-3">Heading</h4>
          <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Nullam ac ante mollis quam tristique convallis</p>
        </div>
        <div class="col-lg-4 col-md-6 col-sm-12">
          <h4 class="mt-lg-0 mt-sm-3">Links</h4>
          <ul class="m-0 p-0">
            <li><a href="#">Lorem ipsum</a></li>
            <li><a href="#">Nam mauris velit</a></li>
            <!-- Agrega más enlaces... -->
          </ul>
        </div>
        <div class="col-lg-4 col-md-12 col-sm-12">
          <h4 class="mt-lg-0 mt-sm-4 mb-3">Contact</h4>
          <p>22, Lorem ipsum dolor, consectetur adipiscing</p>
          <p class="mb-0">(541) 754-3010</p>
          <p>info@hsdf.com</p>
        </div>
      </div>
      <hr>

      <!-- La marquesina con los sponsors -->
      <div class="row mt-4">
        <div class="col">
          <div class="marquee">
            <a href="#"><img src="https://static.igem.wiki/teams/4607/wiki/footer/descarga.png" alt="CTR"></a>
            <a href="#"><img src="https://static.igem.wiki/teams/4607/wiki/footer/sanpgene2.png" alt="snapgene"></a>
            <a href="#"><img src="https://static.igem.wiki/teams/4607/wiki/footer/logo-idt.png" alt="IDT Integrated DNA Technologies"></a>
            <a href="#"><img src="https://static.igem.wiki/teams/4607/wiki/footer/rs-w-1240-cg-true.png" alt="Quimica Tech"></a>
            <a href="#"><img src="https://static.igem.wiki/teams/4607/wiki/footer/logo-ichijuv.png" alt="Ichihuv"></a>
            <a href="#"><img src="https://static.igem.wiki/teams/4607/wiki/footer/eic-tec-de-monterrey.png" alt="Escuela de ingenieria y ciencias tec de Monterrey"></a>
            <a href="#"><img src="https://static.igem.wiki/teams/4607/wiki/footer/neb.png" alt="New England Biolabs"></a>
          </div>
        </div>
      </div>
    </div>
  </footer>

  <!-- Botón "Back to Top" -->
  <div class="back-to-top" id="backToTop">&#8593; Back to Top</div>

  <!-- JavaScript para pausar la marquesina al pasar el cursor sobre ella y para el botón "Back to Top" -->
  <script>
    var marquee = document.querySelector('.marquee');
    marquee.addEventListener('mouseenter', function () {
      this.style.animationPlayState = 'paused';
    });

    marquee.addEventListener('mouseleave', function () {
      this.style.animationPlayState = 'running';
    });

    var backToTopButton = document.getElementById('backToTop');
    window.addEventListener('scroll', function () {
      if (window.scrollY > 300) {
        backToTopButton.style.display = 'block';
      } else {
        backToTopButton.style.display = 'none';
      }
    });

    backToTopButton.addEventListener('click', function () {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    });
  </script>
</body>
</html>

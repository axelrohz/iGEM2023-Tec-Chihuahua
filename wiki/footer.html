    /* Estilos para el contenedor de la marquesina */
    .marquee {
      display: flex;
      
      white-space: nowrap;
      animation: marquee 12s linear infinite; /* Ajusta la velocidad según lo desees */
    
    }
    @keyframes marquee {
      0% { transform: translate(-5%, 0); }
      100% { transform: translate(-110%,0); }
    }

      padding: 10px 0; /* Reduce el padding en dispositivos móviles */
    }
    .footer h4 {
      color: #555; /* Color de encabezado más suave */
    }
    .footer p {
      margin-bottom: 10px; /* Espacio entre párrafos en el footer */

    /* Estilos para el botón "Back to Top" */

      bottom: 20px;
      right: 20px;

        display: block;

      }
      
      .parallax1 > use {
        animation: move-forever1 10s linear infinite;
        &:nth-child(1) {
          animation-delay: -2s;
        }
      }
      .parallax2 > use {
        animation: move-forever2 8s linear infinite;
        &:nth-child(1) {
          animation-delay: -2s;
        }
      }
      .parallax3 > use {
        animation: move-forever3 6s linear infinite;
        &:nth-child(1) {
          animation-delay: -2s;
        }
      }
      .parallax4 > use {
        animation: move-forever4 4s linear infinite;
        &:nth-child(1) {
          animation-delay: -2s;
        }
      }
      @keyframes move-forever1 {
        0% {
          transform: translate(85px, 0%);
        }
        100% {
          transform: translate(-90px, 0%);
        }
      }
      @keyframes move-forever2 {
        0% {
          transform: translate(-90px, 0%);
        }
        100% {
          transform: translate(85px, 0%);
        }
      }
      @keyframes move-forever3 {
        0% {
          transform: translate(85px, 0%);
        }
        100% {
          transform: translate(-90px, 0%);
        }
      }
      @keyframes move-forever4 {
        0% {
          transform: translate(-90px, 0%);
        }
        100% {
          transform: translate(85px, 0%);
        }
      }

  <!-- Botón "Back to Top" -->
  <div class="back-to-top" id="backToTop">&#8593; Back to Top</div>

  <!-- JavaScript para pausar la marquesina al pasar el cursor sobre ella y para el botón "Back to Top" -->
  <script>
    var marquee = document.querySelector('.marquee');
    marquee.addEventListener('mouseenter', function () {
      this.style.animationPlayState = 'paused';
    });

    marquee.addEventListener('mouseleave', function () {
      this.style.animationPlayState = 'running';
    });

    var backToTopButton = document.getElementById('backToTop');
    window.addEventListener('scroll', function () {
      if (window.scrollY > 300) {
        backToTopButton.style.display = 'block';
      } else {
        backToTopButton.style.display = 'none';
      }
    });

    backToTopButton.addEventListener('click', function () {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    });
  </script>

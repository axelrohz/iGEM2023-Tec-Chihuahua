{% extends "layout.html" %}
  
{% block title %}Home{% endblock %}
{% block lead %} {% endblock %}

{% block page_content %}


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Header Responsivo</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    .header {
      background-color: #333;
      color: #fff;
      padding: 20px;
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      font-size: 24px;
    }

    .logo h1 {
      margin: 0;
    }

    .nav-links {
      display: flex;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav-links li {
      margin-right: 20px;
    }

    .nav-links a {
      text-decoration: none;
      color: #fff;
    }

    .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
    }

    .hamburger span {
      display: block;
      width: 30px;
      height: 4px;
      margin-bottom: 6px;
      background-color: #fff;
      transition: background-color 0.3s ease;
    }

    .hamburger:hover span {
      background-color: #aaa;
    }

    .carousel-container {
      position: relative;
      overflow: hidden;
    }

    .carousel {
      display: flex;
      transition: transform 0.3s ease;
    }

    .carousel img {
      width: 100%;
      height: auto;
      opacity: 0.8;
      transition: opacity 0.3s ease;
    }

    .carousel img:hover {
      opacity: 1;
    }

    .carousel-text {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: #fff;
      font-size: 24px;
      background-color: rgba(0, 0, 0, 0.6);
      padding: 10px;
      border-radius: 5px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .carousel img:hover + .carousel-text {
      opacity: 1;
    }

    @media (max-width: 768px) {
      .nav-links {
        display: none;
        flex-direction: column;
        background-color: #555;
        position: absolute;
        top: 80px;
        left: 0;
        width: 100%;
      }

      .nav-links li {
        margin: 0;
        text-align: center;
        padding: 10px;
      }

      .hamburger {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <nav class="nav-container">
      <div class="logo">
        <!-- Agrega aquí tu imagen de logo -->
        <!-- <img src="tu-logo.png" alt="Logo"> -->
        <h1>Logo</h1>
      </div>
      <ul class="nav-links">
        <li><a href="#inicio">Inicio</a></li>
        <li><a href="#nosotros">Nosotros</a></li>
        <li><a href="#servicios">Servicios</a></li>
        <li><a href="#contacto">Contacto</a></li>
      </ul>
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </nav>
  </header>
  <div class="carousel-container">
    <div class="carousel">
      <!-- Agrega aquí tus imágenes -->
      <img src="imagen1.jpg" alt="Imagen 1">
      <div class="carousel-text">Texto superpuesto 1</div>
      <img src="imagen2.jpg" alt="Imagen 2">
      <div class="carousel-text">Texto superpuesto 2</div>
      <img src="imagen3.jpg" alt="Imagen 3">
      <div class="carousel-text">Texto superpuesto 3</div>
    </div>
  </div>
  <!-- Aquí continua el resto del contenido de la página -->
</body>
</html>











{% endblock %}

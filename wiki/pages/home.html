{% extends "layout.html" %}
  
{% block title %}Home{% endblock %}
{% block lead %} {% endblock %}

{% block page_content %}




<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slider Responsivo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="slider-container">
    <div class="slider">
      <div class="slide">
        <img src="https://static.igem.wiki/teams/4607/wiki/project-description/images/dsc-0046.jpeg" alt="Imagen 1" class="active">
        <div class="slide-content">
          <h2>Imagen 1</h2>
          <p>Descripción de la imagen 1</p>
        </div>
      </div>
      <div class="slide">
        <img src="https://static.igem.wiki/teams/4607/wiki/project-description/images/dsc-0046.jpeg" alt="Imagen 2">
        <div class="slide-content">
          <h2>Imagen 2</h2>
          <p>Descripción de la imagen 2</p>
        </div>
      </div>
      <div class="slide">
        <img src="https://static.igem.wiki/teams/4607/wiki/project-description/images/dsc-0046.jpeg" alt="Imagen 3">
        <div class="slide-content">
          <h2>Imagen 3</h2>
          <p>Descripción de la imagen 3</p>
        </div>
      </div>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const slider = document.querySelector('.slider');
      const slides = slider.querySelectorAll('.slide');
      const imageWidth = slides[0].clientWidth;
      let currentIndex = 0;

      function slideNext() {
        slides[currentIndex].classList.remove('active');
        currentIndex = (currentIndex + 1) % slides.length;
        slides[currentIndex].classList.add('active');
      }

      setInterval(slideNext, 5000); // Cambia la imagen cada 5 segundos (5000 ms)
    });
  </script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    .slider-container {
      width: 100%;
      max-width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .slider {
      display: flex;
      transition: transform 1s ease;
    }

    .slide {
      position: relative;
      flex: 0 0 100%;
    }

    .slider img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .slider img.active {
      opacity: 1;
    }

    .slide-content {
      position: absolute;
      bottom: 10%;
      left: 5%;
      color: white;
      opacity: 0;
      transition: opacity 0.5s ease;
      width: 90%;
    }

    .slide.active .slide-content {
      opacity: 1;
    }

    .slide-content h2 {
      font-size: 2em;
      margin: 0;
    }

    .slide-content p {
      font-size: 1.2em;
      margin: 0;
    }

    @media (max-width: 768px) {
      .slide-content {
        bottom: 5%;
        left: 2%;
        width: 96%;
      }

      .slide-content h2 {
        font-size: 1.5em;
      }

      .slide-content p {
        font-size: 1em;
      }
    }
  </style>
</body>
</html>









{% endblock %}

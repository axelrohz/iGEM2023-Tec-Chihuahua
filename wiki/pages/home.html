{% extends "layout.html" %}
  
{% block title %}Home{% endblock %}
{% block lead %} {% endblock %}

{% block page_content %}





<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slider Responsivo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="slider-container">
    <div class="slider">
      <div class="slide">
        <img src="https://static.igem.wiki/teams/4607/wiki/project-description/images/dsc-0046.jpeg" alt="Imagen 1" class="active">
        <div class="slide-content">
          <h2>Imagen 1</h2>
          <p>Descripción de la imagen 1</p>
        </div>
      </div>
      <div class="slide">
        <img src="https://static.igem.wiki/teams/4607/wiki/project-description/images/dsc-0046.jpeg" alt="Imagen 2">
        <div class="slide-content">
          <h2>Imagen 2</h2>
          <p>Descripción de la imagen 2</p>
        </div>
      </div>
      <div class="slide">
        <img src="https://static.igem.wiki/teams/4607/wiki/project-description/images/dsc-0046.jpeg" alt="Imagen 3">
        <div class="slide-content">
          <h2>Imagen 3</h2>
          <p>Descripción de la imagen 3</p>
        </div>
      </div>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const slider = document.querySelector('.slider');
      const slides = slider.querySelectorAll('.slide');
      const imageWidth = slides[0].clientWidth;
      let currentIndex = 0;

      function slideNext() {
        slides[currentIndex].classList.remove('active');
        currentIndex = (currentIndex + 1) % slides.length;
        slides[currentIndex].classList.add('active');
        slider.style.transform = `translateX(-${currentIndex * 100}%)`;
      }

      setInterval(slideNext, 5000); // Cambia la imagen cada 5 segundos (5000 ms)
    });
  </script>
  <style>
    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    .slider-container {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .slider {
      display: flex;
      transition: transform 1s ease;
      height: 100%;
      width: 100%;
    }

    .slide {
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 1s ease;
    }

    .slide-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 40px;
      transform: translateY(100%);
      transition: transform 0.5s ease;
    }

    .slider .slide.active .slide-content {
      transform: translateY(0);
    }

    .slide-content h2 {
      margin: 0;
      font-size: 32px;
    }

    .slide-content p {
      margin: 10px 0;
      font-size: 18px;
    }

    @media (max-width: 768px) {
      .slider {
        flex-wrap: nowrap;
      }

      .slider img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .slider-container {
        height: 100vh;
      }

      .slide-content {
        background-color: rgba(0, 0, 0, 0.7);
        padding: 20px;
      }

      .slide-content h2 {
        font-size: 24px;
      }

      .slide-content p {
        font-size: 16px;
      }
    }
  </style>
</body>
</html>











{% endblock %}

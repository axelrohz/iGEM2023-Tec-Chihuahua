{% extends "layout.html" %}
  
{% block title %}Home{% endblock %}
{% block lead %} {% endblock %}

{% block page_content %}


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slider Responsivo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="slider-container">
    <div class="slider">
      <img src="https://static.igem.wiki/teams/4607/wiki/project-description/images/dsc-0046.jpeg" alt="Imagen 1">
      <img src="https://static.igem.wiki/teams/4607/wiki/project-description/images/dsc-0046.jpeg" alt="Imagen 2">
      <img src="https://static.igem.wiki/teams/4607/wiki/project-description/images/dsc-0046.jpeg" alt="Imagen 3">
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const slider = document.querySelector('.slider');
      const images = slider.querySelectorAll('img');
      const imageWidth = images[0].clientWidth;
      let currentIndex = 0;

      function slideNext() {
        currentIndex = (currentIndex + 1) % images.length;
        slider.style.transform = `translateX(-${currentIndex * imageWidth}px)`;
      }

      setInterval(slideNext, 5000); // Cambia la imagen cada 5 segundos (5000 ms)
    });
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
    }

    .slider-container {
      width: 100%;
      overflow: hidden;
    }

    .slider {
      display: flex;
      transition: transform 1s ease;
    }

    .slider img {
      width: 100%;
      height: auto;
    }
  </style>
</body>
</html>












{% endblock %}
